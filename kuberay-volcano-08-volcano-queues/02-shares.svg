<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" style="max-width:960px" role="img" aria-labelledby="v08-shares-title"><title id="v08-shares-title">v08-shares</title><defs><marker id="v08-shares-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="32" text-anchor="start" font-size="18" font-weight="600" fill="#18354b">12 核 CPU，权重 1:2，保障量为零</text><text x="24" y="107" text-anchor="start" font-size="16" font-weight="400" fill="#262a2e">需求充足</text><rect x="228" y="76" width="232" height="49" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="344" y="105.5" text-anchor="middle" font-size="14" font-weight="500" fill="#244f86">A 4 核</text><rect x="460" y="76" width="464" height="49" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="692" y="105.5" text-anchor="middle" font-size="14" font-weight="500" fill="#805929">B 8 核</text><text x="24" y="185" text-anchor="start" font-size="16" font-weight="400" fill="#262a2e">A 只需 2 核</text><rect x="228" y="154" width="116" height="49" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="286" y="183.5" text-anchor="middle" font-size="14" font-weight="500" fill="#244f86">A 2 核</text><rect x="344" y="154" width="580" height="49" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="634" y="183.5" text-anchor="middle" font-size="14" font-weight="500" fill="#805929">B 10 核</text><text x="24" y="263" text-anchor="start" font-size="16" font-weight="400" fill="#262a2e">B 上限 7 核</text><rect x="228" y="232" width="116" height="49" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="286" y="261.5" text-anchor="middle" font-size="14" font-weight="500" fill="#244f86">A 2 核</text><re