<svg xmlns="http://www.w3.org/2000/svg" width="960" height="596" viewBox="0 0 960 596" style="max-width:960px" role="img" aria-labelledby="v08-reclaim-title"><title id="v08-reclaim-title">v08-reclaim</title><defs><marker id="v08-reclaim-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><path d="M100 79 V531" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="17" y="18" width="166" height="58" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="100" y="40.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">调度器</text><text x="100" y="63.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Statement</text><path d="M353.33333333333337 79 V531" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="270.33333333333337" y="18" width="166" height="58" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="353.33333333333337" y="52" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">Kubernetes API</text><path d="M606.6666666666667 79 V531" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="523.6666666666667" y="18" width="166" height="58" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="606.6666666666667" y="52" text-anchor="middle" font-size="15" font-weight="500" fill="#805929">受害 Pod</text><path d="M860 79 V531" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="777" y="18" width="166" height="58" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="860" y="52" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">等待 Pod</text><rect x="24" y="93" width="912" height="42" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="480" y="120" text-anchor="middle" font-size="14" font-weight="400" fill="#415670">前提：启用 preempt / reclaim，且候选、Gang 与放置检查均通过。</text><path d="M100 199 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v08-reclaim-arrow)"/><text x="226.66666666666669" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">提交驱逐请求；等待者先按未来资源记为 Pipelined</text><path d="M353.33333333333337 265 H606.6666666666667" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v08-reclaim-arrow)"/><text x="480.00000000000006" y="250" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">受害 Pod 开始终止，资源此时尚未立即释放</text><path d="M606.6666666666667 331 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#v08-reclaim-arrow)"/><text x="480.00000000000006" y="316" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">退出及对象变化经 API 被观察</text><path d="M353.33333333333337 397 H100" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#v08-reclaim-arrow)"/><text x="226.66666666666669" y="382" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">缓存更新，后续调度再次检查可用资源</text><path d="M100 463 H860" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v08-reclaim-arrow)"/><text x="480" y="448" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">重新分配与绑定，之后由节点启动等待 Pod</text><rect x="24" y="544" width="912" height="42" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="571" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">图中省略节点与绑定组件；驱逐后的应用恢复由运行框架和业务处理。</text></g></svg>