<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" style="max-width:960px" role="img" aria-labelledby="guide-background-title"><title id="guide-background-title">guide-background</title><defs><marker id="guide-background-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="20" y="31" text-anchor="start" font-size="19" font-weight="600" fill="#262a2e">本例：通过 RayJob 执行一次作业</text><rect x="20" y="85" width="250" height="88" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="145" y="111" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">KubeRay</text><text x="145" y="134" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">读取作业声明</text><text x="145" y="157" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">准备资源、跟踪状态</text><rect x="355" y="85" width="250" height="88" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="480" y="111" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">Kubernetes</text><text x="480" y="134" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">安排 Pod 的部署</text><text x="480" y="157" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">启动 head / worker 容器</text><rect x="690" y="85" width="250" height="88" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="815" y="111" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">Ray 运行环境</text><text x="815" y="134" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">head 与 worker</text><text x="815" y="157" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">在容器中组成集群</text><path d="M270 129 H355" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-background-arrow)"/><text x="312" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">资源要求</text><path d="M605 129 H690" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-background-arrow)"/><text x="647" y="115" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">启动容器</text><rect x="355" y="278" width="250" height="78" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="310.5" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">提交程序</text><text x="480" y="333.5" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">把入口命令交给 Ray</text><rect x="690" y="278" width="250" height="78" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="815" y="310.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">Ray 执行用户程序</text><text x="815" y="333.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">安排 task / actor</text><path d="M145 173 V317 H355" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-background-arrow)"/><text x="146" y="241" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">环境就绪后</text><text x="146" y="264" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">安排提交程序</text><path d="M605 317 H690" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-background-arrow)"/><text x="647" y="302" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">提交命令</text><path d="M815 173 V278" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#guide-background-arrow)"/><text x="828" y="231" text-anchor="start" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">提供运行环境</text><rect x="20" y="390" width="920" height="32" rx="6" fill="#f8fafc" stroke="#bdc7d2" stroke-width="1"/><text x="480" y="412" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b">箭头概括职责交接，省略 API 读写与状态检查；计算开始后仍由 KubeRay 跟踪和收尾。</text></g></svg>