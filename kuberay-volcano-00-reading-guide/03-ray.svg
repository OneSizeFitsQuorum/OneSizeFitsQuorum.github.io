<svg xmlns="http://www.w3.org/2000/svg" width="960" height="585" viewBox="0 0 960 585" style="max-width:960px" role="img" aria-labelledby="guide-ray-title"><title id="guide-ray-title">guide-ray</title><defs><marker id="guide-ray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="45" width="245" height="76" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="142.5" y="76.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">KubeRay Operator</text><text x="142.5" y="99.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">读取 RayCluster，维护资源</text><rect x="360" y="45" width="245" height="76" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="482.5" y="76.5" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">Kubernetes API</text><text x="482.5" y="99.5" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">保存 Pod / Service 等对象</text><rect x="700" y="45" width="240" height="76" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="820" y="76.5" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">Scheduler / kubelet</text><text x="820" y="99.5" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">分配节点、启动容器</text><path d="M265 83 H360" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-ray-arrow)"/><text x="313" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">读写资源</text><path d="M605 83 H700" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#guide-ray-arrow)"/><text x="652" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">观察对象</text><path d="M820 121 V178 H250 V250" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-ray-arrow)"/><path d="M820 178 H720 V250" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-ray-arrow)"/><text x="483" y="165" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">将 Ray head / worker 容器启动在选定的节点上</text><rect x="20" y="250" width="445" height="270" rx="6" fill="#f8fafc" stroke="#bdc7d2" stroke-width="1"/><text x="40" y="282" text-anchor="start" font-size="18" font-weight="600" fill="#415670">Kubernetes Node A</text><rect x="495" y="250" width="445" height="270" rx="6" fill="#f8fafc" stroke="#bdc7d2" stroke-width="1"/><text x="515" y="282" text-anchor="start" font-size="18" font-weight="600" fill="#415670">Kubernetes Node B</text><rect x="45" y="315" width="175" height="97" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="132.5" y="345.5" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">head Pod</text><text x="132.5" y="368.5" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">Ray 管理进程</text><text x="132.5" y="391.5" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">及运行组件</text><rect x="270" y="315" width="175" height="97" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="357.5" y="345.5" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">worker Pod A</text><text x="357.5" y="368.5" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">Ray 运行组件</text><text x="357.5" y="391.5" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">用户执行进程</text><rect x="560" y="315" width="315" height="97" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="717.5" y="357" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">worker Pod B</text><text x="717.5" y="380" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">Ray 运行组件 / 用户执行进程</text><path d="M220 363 H270" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><path d="M445 363 H560" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><path d="M132 412 V458 H717 V412" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><text x="483" y="450" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ray 节点协作：安排 task / actor、传递计算数据</text><text x="242" y="496" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b">本例放置一个 head 和一个 worker</text><text x="717" y="496" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b">本例放置另一个 worker</text><rect x="20" y="541" width="920" height="32" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="563" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b">部署位置仅为示例；Ray 节点之间的计算与数据通信不经过 Operator。</text></g></svg>