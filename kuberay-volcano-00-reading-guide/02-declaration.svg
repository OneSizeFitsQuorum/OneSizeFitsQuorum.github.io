<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" style="max-width:1000px" role="img" aria-labelledby="guide-declaration-title"><title id="guide-declaration-title">guide-declaration</title><defs><marker id="guide-declaration-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="11" y="15" width="148" height="58" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="85" y="37.5" text-anchor="middle" font-size="14" font-weight="500" fill="#805929">使用者</text><text x="85" y="60.5" text-anchor="middle" font-size="14" font-weight="500" fill="#805929">kubectl</text><path d="M85 73 V595" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="177" y="15" width="148" height="58" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="251" y="37.5" text-anchor="middle" font-size="14" font-weight="500" fill="#415670">API Server</text><text x="251" y="60.5" text-anchor="middle" font-size="14" font-weight="500" fill="#415670">资源对象</text><path d="M251 73 V595" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="343" y="15" width="148" height="58" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="417" y="37.5" text-anchor="middle" font-size="14" font-weight="500" fill="#244f86">内置控制器</text><text x="417" y="60.5" text-anchor="middle" font-size="14" font-weight="500" fill="#244f86">Deployment / RS</text><path d="M417 73 V595" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="509" y="15" width="148" height="58" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="583" y="37.5" text-anchor="middle" font-size="14" font-weight="500" fill="#415670">Scheduler</text><text x="583" y="60.5" text-anchor="middle" font-size="14" font-weight="500" fill="#415670">调度</text><path d="M583 73 V595" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="675" y="15" width="148" height="58" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="749" y="37.5" text-anchor="middle" font-size="14" font-weight="500" fill="#415670">kubelet</text><text x="749" y="60.5" text-anchor="middle" font-size="14" font-weight="500" fill="#415670">节点代理</text><path d="M749 73 V595" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="841" y="15" width="148" height="58" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="915" y="37.5" text-anchor="middle" font-size="14" font-weight="500" fill="#256354">容器运行时</text><text x="915" y="60.5" text-anchor="middle" font-size="14" font-weight="500" fill="#256354">启动容器</text><path d="M915 73 V595" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><path d="M85 115 H251" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-declaration-arrow)"/><text x="168" y="105" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">提交 Deployment：replicas = 2</text><path d="M251 169 H417" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#guide-declaration-arrow)"/><text x="334" y="159" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">控制器观察到资源变化</text><path d="M417 223 H251" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-declaration-arrow)"/><text x="334" y="213" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Deployment Controller 创建 ReplicaSet</text><path d="M417 277 H251" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-declaration-arrow)"/><text x="334" y="267" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">ReplicaSet Controller 创建两个 Pod</text><path d="M251 331 H583" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#guide-declaration-arrow)"/><text x="417" y="321" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">观察尚未分配节点的 Pod</text><path d="M583 385 H251" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-declaration-arrow)"/><text x="417" y="375" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">选定 Node，通过 API 记录绑定</text><path d="M251 439 H749" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#guide-declaration-arrow)"/><text x="500" y="429" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">观察分配给本节点的 Pod</text><path d="M749 493 H915" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-declaration-arrow)"/><text x="832" y="483" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">按 Pod 配置启动容器</text><path d="M749 547 H251" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#guide-declaration-arrow)"/><text x="500" y="537" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">回报 Pod 状态；控制器继续观察</text><rect x="20" y="605" width="960" height="32" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="500" y="627" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b">每个 Pod 分别调度与启动；图中合并重复步骤，虚线表示观察或状态反馈。</text></g></svg>