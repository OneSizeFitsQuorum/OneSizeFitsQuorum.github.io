<svg xmlns="http://www.w3.org/2000/svg" width="960" height="655" viewBox="0 0 960 655" style="max-width:960px" role="img" aria-labelledby="guide-options-title"><title id="guide-options-title">guide-options</title><defs><marker id="guide-options-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="33" text-anchor="start" font-size="19" font-weight="600" fill="#262a2e">部署环境按需求选择，批调度按需接入</text><rect x="24" y="75" width="275" height="95" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="161.5" y="104.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">Ray 单机 / 多机部署</text><text x="161.5" y="127.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">可直接运行 Ray 进程</text><text x="161.5" y="150.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">不要求 Kubernetes</text><rect x="345" y="75" width="590" height="95" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="640" y="116" text-anchor="middle" font-size="17" font-weight="500" fill="#244f86">本系列选择：Kubernetes 场景</text><text x="640" y="139" text-anchor="middle" font-size="17" font-weight="500" fill="#244f86">使用 KubeRay 管理 Ray 集群与作业</text><rect x="24" y="222" width="912" height="409" rx="6" fill="#f8fafc" stroke="#bdc7d2" stroke-width="1"/><text x="45" y="252" text-anchor="start" font-size="17" font-weight="600" fill="#415670">展开右侧部署方式</text><path d="M640 170 V222" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#guide-options-arrow)"/><rect x="44" y="296" width="180" height="64" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="134" y="321.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">KubeRay</text><text x="134" y="344.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">维护 Ray 资源</text><rect x="281" y="296" width="185" height="64" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="373.5" y="321.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">Kubernetes API</text><text x="373.5" y="344.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">保存资源声明</text><path d="M224 328 H281" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-options-arrow)"/><rect x="584" y="277" width="325" height="56" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="746.5" y="310" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">默认调度器：为 Pod 选择节点</text><rect x="584" y="389" width="325" height="67" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1" stroke-dasharray="5 4"/><text x="746.5" y="416" text-anchor="middle" font-size="15" font-weight="500" fill="#805929">Volcano：按调度需求接入</text><text x="746.5" y="439" text-anchor="middle" font-size="15" font-weight="500" fill="#805929">成组调度、队列资源策略</text><path d="M466 328 H520 V305 H584" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-options-arrow)"/><path d="M520 328 V422 H584" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#guide-options-arrow)"/><text x="522" y="377" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">选定调度器</text><rect x="584" y="509" width="325" height="65" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="746.5" y="535" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">节点 kubelet 与容器运行时</text><text x="746.5" y="558" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">启动已分配到本机的 Pod</text><path d="M909 305 H924 V481 H747 V509" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-options-arrow)"/><path d="M747 456 V509" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#guide-options-arrow)"/><rect x="44" y="509" width="380" height="65" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="234" y="535" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">Ray 运行环境</text><text x="234" y="558" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">执行用户程序，安排 task / actor</text><path d="M584 542 H424" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#guide-options-arrow)"/><text x="504" y="527" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">启动 Ray 容器</text><text x="480" y="609" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b">同一个 Pod 交给所选调度器处理；两条调度路径不表示必须依次经过。</text></g></svg>