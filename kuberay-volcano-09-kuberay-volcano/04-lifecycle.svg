<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" style="max-width:960px" role="img" aria-labelledby="kv09-flow-title">
  <title id="kv09-flow-title">RayJob 默认流程与启用 Volcano 后的流程对比</title>
  <defs>
    <marker id="kv09-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.4"/>
    </marker>
    <style>
      .t{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#26323d}.h{font-size:20px;font-weight:700;fill:#18354b}.s{font-size:15px;font-weight:600}.n{font-size:13px;fill:#56616b}.box{fill:#f7f9fc;stroke:#a9b6c8;stroke-width:1.2}.ray{fill:#edf3ff;stroke:#8ba9d6}.vol{fill:#fff4e5;stroke:#d5b181}.ok{fill:#eaf6f2;stroke:#8dbdb0}.line{stroke:#68717a;stroke-width:1.4;fill:none;marker-end:url(#kv09-arrow)}
    </style>
  </defs>
  <rect width="960" height="620" fill="white"/>
  <text class="t h" x="28" y="38">不开启批调度</text>
  <g class="t">
    <rect class="box ray" x="28" y="70" width="118" height="58" rx="7"/><text class="s" x="87" y="96" text-anchor="middle">RayJob</text><text class="n" x="87" y="116" text-anchor="middle">初始化身份</text>
    <rect class="box ray" x="178" y="70" width="130" height="58" rx="7"/><text class="s" x="243" y="96" text-anchor="middle">写入 RayCluster</text><text class="n" x="243" y="116" text-anchor="middle">RayJob Controller</text>
    <rect class="box" x="340" y="70" width="128" height="58" rx="7"/><text class="s" x="404" y="96" text-anchor="middle">协调 Service/Pod</text><text class="n" x="404" y="116" text-anchor="middle">独立 Reconcile</text>
    <rect class="box" x="500" y="70" width="132" height="58" rx="7"/><text class="s" x="566" y="96" text-anchor="middle">默认调度器</text><text class="n" x="566" y="116" text-anchor="middle">逐个绑定 Pod</text>
    <rect class="box ok" x="664" y="70" width="116" height="58" rx="7"/><text class="s" x="722" y="96" text-anchor="middle">Cluster Ready</text><text class="n" x="722" y="116" text-anchor="middle">KubeRay 等待</text>
    <rect class="box ray" x="812" y="70" width="120" height="58" rx="7"/><text class="s" x="872" y="96" text-anchor="middle">创建 submitter</text><text class="n" x="872" y="116" text-anchor="middle">提交 Ray 作业</text>
    <path class="line" d="M146 99 H178"/><path class="line" d="M308 99 H340"/><path class="line" d="M468 99 H500"/><path class="line" d="M632 99 H664"/><path class="line" d="M780 99 H812"/>
  </g>
  <text class="t n" x="28" y="162">head 和 worker 没有共同的 PodGroup 门槛，各自经过默认调度器。</text>

  <line x1="28" y1="198" x2="932" y2="198" stroke="#d7dde6"/>
  <text class="t h" x="28" y="238">启用 Volcano</text>
  <g class="t">
    <rect class="box ray" x="28" y="270" width="118" height="58" rx="7"/><text class="s" x="87" y="296" text-anchor="middle">RayJob</text><text class="n" x="87" y="316" text-anchor="middle">计算组需求</text>
    <rect class="box vol" x="178" y="270" width="130" height="58" rx="7"/><text class="s" x="243" y="296" text-anchor="middle">写入 PodGroup</text><text class="n" x="243" y="316" text-anchor="middle">API 成功即继续</text>
    <rect class="box ray" x="340" y="270" width="130" height="58" rx="7"/><text class="s" x="405" y="296" text-anchor="middle">写入 RayCluster</text><text class="n" x="405" y="316" text-anchor="middle">不等待 PG Ready</text>
    <rect class="box" x="502" y="270" width="130" height="58" rx="7"/><text class="s" x="567" y="296" text-anchor="middle">协调 Service/Pod</text><text class="n" x="567" y="316" text-anchor="middle">写入组名和角色</text>
    <rect class="box vol" x="664" y="270" width="116" height="58" rx="7"/><text class="s" x="722" y="296" text-anchor="middle">Volcano</text><text class="n" x="722" y="316" text-anchor="middle">Gang 分配与绑定</text>
    <rect class="box ok" x="812" y="270" width="120" height="58" rx="7"/><text class="s" x="872" y="296" text-anchor="middle">Cluster Ready</text><text class="n" x="872" y="316" text-anchor="middle">KubeRay 等待</text>
    <path class="line" d="M146 299 H178"/><path class="line" d="M308 299 H340"/><path class="line" d="M470 299 H502"/><path class="line" d="M632 299 H664"/><path class="line" d="M780 299 H812"/>

    <rect class="box ray" x="340" y="412" width="170" height="62" rx="7"/><text class="s" x="425" y="439" text-anchor="middle">创建 submitter Job</text><text class="n" x="425" y="460" text-anchor="middle">Ready 之后才创建</text>
    <rect class="box vol" x="560" y="412" width="170" height="62" rx="7"/><text class="s" x="645" y="439" text-anchor="middle">submitter Pod</text><text class="n" x="645" y="460" text-anchor="middle">加入同一个 PodGroup</text>
    <rect class="box ok" x="780" y="412" width="152" height="62" rx="7"/><text class="s" x="856" y="439" text-anchor="middle">Ray Jobs API</text><text class="n" x="856" y="460" text-anchor="middle">提交用户程序</text>
    <path class="line" d="M872 328 V370 H425 V412"/><path class="line" d="M510 443 H560"/><path class="line" d="M730 443 H780"/>
  </g>
  <rect x="28" y="522" width="904" height="68" rx="8" fill="#f7f9fc" stroke="#c5cfdd"/>
  <text class="t s" x="48" y="550">关键差异</text>
  <text class="t n" x="48" y="574">Volcano 路径在创建 RayCluster 前写入 PodGroup，并让所有成员 Pod 携带同一组名；RayCluster Ready 仍是创建 submitter 的前提。</text>
</svg>
