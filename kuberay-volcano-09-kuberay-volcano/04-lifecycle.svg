<svg xmlns="http://www.w3.org/2000/svg" width="960" height="728" viewBox="0 0 960 728" style="max-width:960px" role="img" aria-labelledby="v09-lifecycle-title"><title id="v09-lifecycle-title">v09-lifecycle</title><defs><marker id="v09-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><path d="M100 79 V663" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="17" y="18" width="166" height="58" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="100" y="40.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">KubeRay</text><text x="100" y="63.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Controllers</text><path d="M353.33333333333337 79 V663" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="270.33333333333337" y="18" width="166" height="58" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="353.33333333333337" y="52" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">API / Volcano</text><path d="M606.6666666666667 79 V663" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="523.6666666666667" y="18" width="166" height="58" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="606.6666666666667" y="52" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">Ray 集群</text><path d="M860 79 V663" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="777" y="18" width="166" height="58" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="860" y="52" text-anchor="middle" font-size="15" font-weight="500" fill="#805929">submitter</text><path d="M100 133 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-lifecycle-arrow)"/><text x="237.25" y="118" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">先维护 PodGroup：minMember = 3，minResources = H + 2W + S</text><path d="M100 199 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-lifecycle-arrow)"/><text x="226.66666666666669" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">创建 RayCluster，再生成 head / worker Pod</text><path d="M353.33333333333337 265 H606.6666666666667" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-lifecycle-arrow)"/><text x="480.00000000000006" y="250" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">调度与绑定后，节点启动 Ray 容器</text><path d="M606.6666666666667 331 H100" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#v09-lifecycle-arrow)"/><text x="353.33333333333337" y="316" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">KubeRay 后续观察到 RayCluster 就绪</text><path d="M100 397 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-lifecycle-arrow)"/><text x="226.66666666666669" y="382" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">创建 submitter Job，其 Pod 关联同一个 PodGroup</text><path d="M353.33333333333337 463 H860" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-lifecycle-arrow)"/><text x="606.6666666666667" y="448" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">submitter Pod 调度、绑定、启动</text><path d="M860 529 H606.6666666666667" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-lifecycle-arrow)"/><text x="733.3333333333334" y="514" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">调用 Ray Jobs API 提交用户程序</text><rect x="24" y="555" width="912" height="42" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="480" y="582" text-anchor="middle" font-size="14" font-weight="400" fill="#415670">作业完成后，按结束策略保留或删除集群，重新计算 PodGroup 需求。</text><rect x="24" y="676" width="912" height="42" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="703" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">调度器安排 Pod；Ray 执行用户计算；结束后的资源释放仍需要观察实际对象。</text></g></svg>