<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">从 RayCluster 到 head 和 worker Pod 的创建链</title>
  <desc id="desc">RayJob Controller 创建 RayCluster 对象，RayCluster Controller 通过独立的 Reconcile 创建 Service 和 Pod，调度器绑定节点，kubelet 启动容器。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="960" height="560" fill="#fbfcfe"/>
  <style>.t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#243449}.h{font-size:22px;font-weight:700}.m{font-size:16px;font-weight:700}.s{font-size:14px;fill:#536579}.box{fill:#fff;stroke:#9fb1c5;stroke-width:1.5}.ray{fill:#eef4ff;stroke:#78a3e8}.vol{fill:#fff3e8;stroke:#df9b62}.ok{fill:#eaf7f3;stroke:#79baa8}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}</style>
  <text x="36" y="42" class="t h">RayCluster 对象写入以后，另一条协调路径开始工作</text>
  <text x="36" y="72" class="t s">创建 Pod 对象、选择节点和启动容器由三个组件分别完成。</text>

  <rect x="34" y="116" width="170" height="82" rx="12" class="ray"/><text x="119" y="148" text-anchor="middle" class="t m">RayJob Controller</text><text x="119" y="174" text-anchor="middle" class="t s">Create(RayCluster)</text>
  <rect x="258" y="116" width="170" height="82" rx="12" class="box"/><text x="343" y="148" text-anchor="middle" class="t m">Kubernetes API</text><text x="343" y="174" text-anchor="middle" class="t s">保存 RayCluster</text>
  <rect x="482" y="116" width="204" height="82" rx="12" class="ray"/><text x="584" y="148" text-anchor="middle" class="t m">RayCluster Controller</text><text x="584" y="174" text-anchor="middle" class="t s">watch → queue → Reconcile</text>
  <path d="M204 157H258M428 157H482" class="line"/>

  <rect x="482" y="256" width="204" height="76" rx="12" class="box"/><text x="584" y="285" text-anchor="middle" class="t m">reconcileHeadService</text><text x="584" y="309" text-anchor="middle" class="t s">先维护 head Service</text>
  <rect x="482" y="382" width="204" height="98" rx="12" class="ray"/><text x="584" y="412" text-anchor="middle" class="t m">reconcilePods</text><text x="584" y="438" text-anchor="middle" class="t s">list 现有 Pod，计算缺口</text><text x="584" y="462" text-anchor="middle" class="t s">build → 加调度元数据 → Create</text>
  <path d="M584 198V256M584 332V382" class="line"/>

  <rect x="742" y="256" width="184" height="76" rx="12" class="vol"/><text x="834" y="285" text-anchor="middle" class="t m">调度器</text><text x="834" y="309" text-anchor="middle" class="t s">为 Pod 选择 Node</text>
  <rect x="742" y="382" width="184" height="98" rx="12" class="ok"/><text x="834" y="412" text-anchor="middle" class="t m">节点 kubelet</text><text x="834" y="438" text-anchor="middle" class="t s">观察已绑定 Pod</text><text x="834" y="462" text-anchor="middle" class="t s">启动 head、worker 容器</text>
  <path d="M686 431H714V294H742" class="line"/><path d="M834 332V382" class="line"/>

  <rect x="34" y="256" width="338" height="224" rx="12" fill="#f2f6fa" stroke="#c9d5e2"/>
  <text x="58" y="290" class="t m">谁创建了什么</text>
  <text x="58" y="326" class="t s">RayJob Controller：RayCluster 对象</text>
  <text x="58" y="360" class="t s">RayCluster Controller：Service、Pod 对象</text>
  <text x="58" y="394" class="t s">默认调度器或 Volcano：Pod 的节点绑定</text>
  <text x="58" y="428" class="t s">kubelet：节点上的容器进程</text>
  <text x="58" y="462" class="t s">Pod 状态变化：再次触发 RayCluster Reconcile</text>

  <text x="480" y="526" text-anchor="middle" class="t s">RayCluster 的 Create 返回成功，只说明对象已写入 API；Pod 的创建发生在 RayCluster Controller 随后的独立协调中。</text>
</svg>
