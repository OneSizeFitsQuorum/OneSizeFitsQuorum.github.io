<svg xmlns="http://www.w3.org/2000/svg" width="960" height="481" viewBox="0 0 960 481" style="max-width:960px" role="img" aria-labelledby="v09-dependency-title"><title id="v09-dependency-title">v09-dependency</title><defs><marker id="v09-dependency-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="32" text-anchor="start" font-size="18" font-weight="600" fill="#18354b">submitter 等待集群就绪，最低成员数必须避开这条依赖</text><rect x="24" y="65" width="442" height="334" rx="6" fill="#f8fafc" stroke="#bdc7d2" stroke-width="1"/><rect x="494" y="65" width="442" height="334" rx="6" fill="#f8fafc" stroke="#bdc7d2" stroke-width="1"/><text x="245" y="96" text-anchor="middle" font-size="17" font-weight="600" fill="#262a2e">假设 minMember = 4</text><text x="715" y="96" text-anchor="middle" font-size="17" font-weight="600" fill="#262a2e">当前 minMember = 3</text><rect x="71" y="132" width="348" height="55" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="245" y="164.5" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">Gang 等四个成员</text><path d="M245 187 V220" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-dependency-arrow)"/><rect x="71" y="220" width="348" height="55" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="245" y="252.5" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">集群无法启动、就绪</text><path d="M245 275 V308" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-dependency-arrow)"/><rect x="71" y="308" width="348" height="55" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="245" y="340.5" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">submitter 尚未创建</text><rect x="529" y="132" width="372" height="55" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="715" y="164.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">三个 Ray Pod 满足门槛</text><path d="M715 187 V220" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-dependency-arrow)"/><rect x="529" y="220" width="372" height="55" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="715" y="252.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">启动 head / worker，集群就绪</text><path d="M715 275 V308" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-dependency-arrow)"/><rect x="529" y="308" width="372" height="55" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="715" y="340.5" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">创建并调度 submitter</text><path d="M71 335 H47 V159 H71" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v09-dependency-arrow)"/><text x="245" y="385" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">缺少的第四个成员无法产生</text><text x="715" y="385" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">随后仍需满足实际放置条件</text><rect x="24" y="421" width="912" height="42" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="448" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">两边都讨论同一启动顺序；当前实现的 minResources 仍包括 submitter 的需求 S。</text></g></svg>