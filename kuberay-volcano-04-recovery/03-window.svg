<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="521" viewBox="0 0 1000 521" style="max-width:1000px" role="img" aria-labelledby="window-title"><title id="window-title">window</title><defs><marker id="window-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="17" y="16" width="176" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="105" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">原 Operator</text><path d="M105 68 V475" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="412" y="16" width="176" height="52" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="500" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">Kubernetes API</text><path d="M500 68 V475" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="807" y="16" width="176" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="895" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">重启后的 Operator</text><path d="M895 68 V475" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><path d="M105 111 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#window-arrow)"/><text x="302.5" y="101" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">先持久化 集群名与 submission ID</text><path d="M105 166 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#window-arrow)"/><text x="302.5" y="156" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">创建 submitter Job：demo-job</text><rect x="24" y="199" width="952" height="33" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="500" y="221" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b">故障窗口：创建已成功，响应丢失或后续 status 尚未写回。</text><path d="M895 276 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#window-arrow)"/><text x="697.5" y="266" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">重新读取 RayJob：仍为 Initializing</text><path d="M895 331 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#window-arrow)"/><text x="697.5" y="321" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">createK8sJobIfNeed：查询同名 Job</text><path d="M500 386 H895" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#window-arrow)"/><text x="697.5" y="376" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">返回已经存在的 submitter Job</text><path d="M895 441 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#window-arrow)"/><text x="697.5" y="431" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">写回管理状态 Running，跟踪作业</text><text x="500" y="508" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">同一轮执行的稳定身份帮助识别已有对象；不意味着所有外部调用恰好执行一次。</text></g></svg>