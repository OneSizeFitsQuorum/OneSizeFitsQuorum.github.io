<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" style="max-width:960px" role="img" aria-labelledby="state-title"><title id="state-title">state</title><defs><marker id="state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="25" width="292" height="238" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="38" y="58" text-anchor="start" font-size="18" font-weight="600" fill="#415670">Kubernetes 中</text><path d="M38 77 L294 77" stroke="#d9dde1" stroke-width="1"/><text x="38" y="110" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">RayJob / RayCluster spec</text><text x="38" y="142" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">Controller 写回的 status</text><text x="38" y="174" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">Pod、Service、Job 实体</text><text x="38" y="206" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">资源身份、拥有关系与删除标记</text><rect x="334" y="25" width="292" height="238" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="352" y="58" text-anchor="start" font-size="18" font-weight="600" fill="#244f86">Operator 进程中</text><path d="M352 77 L608 77" stroke="#d9dde1" stroke-width="1"/><text x="352" y="110" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">缓存和待处理队列</text><text x="352" y="142" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">正在执行的函数与局部变量</text><text x="352" y="174" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">expectations 等辅助记录</text><text x="352" y="206" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">进程退出后不原样保留</text><rect x="648" y="25" width="292" height="238" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="666" y="58" text-anchor="start" font-size="18" font-weight="600" fill="#256354">Ray 与外部存储中</text><path d="M666 77 L922 77" stroke="#d9dde1" stroke-width="1"/><text x="666" y="110" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">Ray Jobs 状态与运行进程</text><text x="666" y="142" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">GCS 及其配置的存储后端</text><text x="666" y="174" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">业务结果、日志和检查点</text><text x="666" y="206" text-anchor="start" font-size="15" font-weight="400" fill="#262a2e">恢复能力由对应组件决定</text><text x="480" y="306" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">重新启动 Operator，会重新读取这些状态，而不是恢复原来的函数调用栈。</text></g></svg>