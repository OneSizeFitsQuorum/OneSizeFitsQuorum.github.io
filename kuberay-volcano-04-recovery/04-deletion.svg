<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="466" viewBox="0 0 1000 466" style="max-width:1000px" role="img" aria-labelledby="deletion-title"><title id="deletion-title">deletion</title><defs><marker id="deletion-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="17" y="16" width="176" height="52" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="105" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">使用者 / API</text><path d="M105 68 V420" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="412" y="16" width="176" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="500" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">RayJob Controller</text><path d="M500 68 V420" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="807" y="16" width="176" height="52" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="895" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">Ray / 下级资源</text><path d="M895 68 V420" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><path d="M105 111 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#deletion-arrow)"/><text x="302.5" y="101" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">删除请求：对象出现 deletionTimestamp</text><rect x="24" y="144" width="952" height="33" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="500" y="166" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b">finalizer 尚在：对象保留，Controller 执行删除前的处理。</text><path d="M500 221 H895" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#deletion-arrow)"/><text x="697.5" y="211" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">按状态尝试停止仍在运行的 Ray 作业</text><rect x="24" y="254" width="952" height="33" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="500" y="276" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b">StopJob 失败也可能继续；这里不等待 Ray 确认停止完成。</text><path d="M500 331 H105" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#deletion-arrow)"/><text x="302.5" y="321" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">尝试移除 finalizer；更新失败则重试</text><path d="M105 386 H895" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#deletion-arrow)"/><text x="500" y="376" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">owner reference 为 Kubernetes 垃圾回收提供依据</text><text x="500" y="453" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">级联删除顺序取决于传播策略；正常完成后的 TTL 清理是另一入口。</text></g></svg>