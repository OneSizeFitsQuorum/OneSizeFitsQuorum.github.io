<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" style="max-width:960px" role="img" aria-labelledby="lifecycle-title"><title id="lifecycle-title">lifecycle</title><defs><marker id="lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="70" width="200" height="58" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="120" y="104" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">New</text><path d="M220 99 H260" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#lifecycle-arrow)"/><rect x="260" y="70" width="200" height="58" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="360" y="104" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Initializing</text><path d="M460 99 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#lifecycle-arrow)"/><rect x="500" y="70" width="200" height="58" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="600" y="104" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Running</text><path d="M700 99 H740" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#lifecycle-arrow)"/><rect x="740" y="70" width="200" height="58" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="840" y="104" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">Complete</text><text x="120" y="51" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">选择并保存身份</text><text x="360" y="51" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">准备集群与提交程序</text><text x="840" y="51" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">正常终态条件满足</text><rect x="500" y="200" width="200" height="55" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="600" y="232.5" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">本轮失败判定</text><path d="M600 128 V200" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#lifecycle-arrow)"/><rect x="740" y="200" width="200" height="55" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="840" y="232.5" text-anchor="middle" font-size="15" font-weight="500" fill="#805929">Failed：不再重试</text><path d="M700 227 H740" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#lifecycle-arrow)"/><text x="840" y="184" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">额度耗尽或原因不允许</text><rect x="260" y="200" width="200" height="55" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="360" y="232.5" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">Retrying</text><path d="M500 227 H460" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#lifecycle-arrow)"/><text x="360" y="184" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">符合重试条件</text><rect x="20" y="320" width="400" height="55" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="220" y="352.5" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">删除旧 RayCluster 和 submitter Job</text><path d="M360 255 V285 H220 V320" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#lifecycle-arrow)"/><rect x="500" y="320" width="440" height="55" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="720" y="352.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">确认对象不存在 → 清空本轮身份</text><path d="M420 347 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#lifecycle-arrow)"/><path d="M940 347 V414 H8 V155 H120 V128" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#lifecycle-arrow)"/><text x="536" y="406" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">回到 New，开始新的执行轮次</text><rect x="20" y="456" width="920" height="38" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="481" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">主干示意：Complete 也可对应 STOPPED；暂停、校验失败等分支见正文。</text></g></svg>