<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" style="max-width:960px" role="img" aria-labelledby="system-title"><title id="system-title">system</title><defs><marker id="system-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="25" y="30" width="220" height="64" rx="6" fill="#f8fafc" stroke="#bdc7d2" stroke-width="1"/><text x="135" y="67" text-anchor="middle" font-size="16" font-weight="500" fill="#394b5d">使用者</text><rect x="370" y="30" width="220" height="64" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="480" y="55.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">Kubernetes API</text><text x="480" y="78.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">保存资源与状态</text><rect x="715" y="30" width="220" height="64" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="825" y="55.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">Kubernetes</text><text x="825" y="78.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">调度 Pod、启动容器</text><rect x="25" y="235" width="220" height="72" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1.5"/><text x="135" y="264.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">KubeRay Operator</text><text x="135" y="287.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">执行协调逻辑</text><rect x="370" y="235" width="220" height="72" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="264.5" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">submitter</text><text x="480" y="287.5" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">运行 Ray CLI</text><rect x="715" y="235" width="220" height="72" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="825" y="264.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">Ray head / worker</text><text x="825" y="287.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">执行用户程序</text><path d="M245 62 H370" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#system-arrow)"/><text x="308" y="49" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">创建 RayJob</text><path d="M590 62 H715" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#system-arrow)"/><text x="652" y="49" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">资源变化</text><path d="M825 94 V235" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#system-arrow)"/><text x="839" y="165" text-anchor="start" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">启动容器</text><path d="M135 235 V160 H480 V94" fill="none" stroke="#245e86" stroke-width="1.35" marker-end="url(#system-arrow)"/><text x="295" y="147" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">读取、观察、更新资源</text><path d="M590 271 H715" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#system-arrow)"/><text x="652" y="257" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Jobs API</text><path d="M135 307 V367 H825 V307" fill="none" stroke="#245e86" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#system-arrow)"/><text x="480" y="356" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ray 管理 API：查询作业、管理 Serve 应用</text><text x="480" y="328" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">由 Kubernetes Job 启动</text></g></svg>