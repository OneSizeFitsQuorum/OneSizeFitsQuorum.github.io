<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" style="max-width:1000px" role="img" aria-labelledby="submit-title"><title id="submit-title">submit</title><defs><marker id="submit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="18" width="170" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1.5"/><text x="105" y="37.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">RayJob</text><text x="105" y="60.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Controller</text><path d="M105 70 V615" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="217" y="18" width="170" height="52" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="302" y="49" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">Kubernetes API</text><path d="M302 70 V615" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="414" y="18" width="170" height="52" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="499" y="49" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">Kubernetes</text><path d="M499 70 V615" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="611" y="18" width="170" height="52" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="696" y="49" text-anchor="middle" font-size="15" font-weight="500" fill="#805929">submitter</text><path d="M696 70 V615" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="808" y="18" width="170" height="52" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="893" y="37.5" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">Ray head</text><text x="893" y="60.5" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">Jobs API</text><path d="M893 70 V615" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><path d="M105 109 H302" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#submit-arrow)"/><rect x="88.3" y="85" width="230.4" height="21" rx="6" fill="white" stroke="none" stroke-width="1"/><text x="203.5" y="101" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">创建 submitter Job</text><path d="M499 152 H302" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#submit-arrow)"/><rect x="285.3" y="128" width="230.4" height="21" rx="6" fill="white" stroke="none" stroke-width="1"/><text x="400.5" y="144" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">观察 Job，创建并调度 Pod</text><path d="M499 195 H696" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#submit-arrow)"/><rect x="549.3" y="171" width="96.4" height="21" rx="6" fill="white" stroke="none" stroke-width="1"/><text x="597.5" y="187" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">启动提交容器</text><path d="M696 238 H893" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#submit-arrow)"/><rect x="746.3" y="214" width="96.4" height="21" rx="6" fill="white" stroke="none" stroke-width="1"/><text x="794.5" y="230" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">提交入口命令</text><path d="M893 281 H696" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#submit-arrow)"/><rect x="746.3" y="257" width="96.4" height="21" rx="6" fill="white" stroke="none" stroke-width="1"/><text x="794.5" y="273" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">返回提交结果</text><rect x="23" y="306" width="954" height="31" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="500" y="327" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">Ray 启动入口程序；submitter 跟踪日志；Operator 多轮查询执行状态</text><path d="M105 367 H893" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#submit-arrow)"/><rect x="330.2" y="343" width="337.6" height="21" rx="6" fill="white" stroke="none" stroke-width="1"/><text x="499" y="359" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">GetJobInfo(status.jobId)</text><path d="M893 410 H105" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#submit-arrow)"/><rect x="417.3" y="386" width="163.4" height="21" rx="6" fill="white" stroke="none" stroke-width="1"/><text x="499" y="402" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">返回 Ray 作业状态</text><path d="M105 453 H302" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#submit-arrow)"/><rect x="-25.599999999999994" y="429" width="458.2" height="21" rx="6" fill="white" stroke="none" stroke-width="1"/><text x="203.5" y="445" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">检查 submitter Job，更新 RayJob status</text><rect x="23" y="478" width="954" height="31" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="500" y="499" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">成功路径：Ray 作业及 submitter 满足完成条件，写入终态；等待 60 秒 TTL</text><path d="M105 539 H302" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#submit-arrow)"/><rect x="95" y="515" width="217" height="21" rx="6" fill="white" stroke="none" stroke-width="1"/><text x="203.5" y="531" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">删除专用 RayCluster</text><path d="M499 582 H302" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#submit-arrow)"/><rect x="318.8" y="558" width="163.4" height="21" rx="6" fill="white" stroke="none" stroke-width="1"/><text x="400.5" y="574" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">按拥有关系回收下级资源</text><text x="500" y="646" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">本例保留 RayJob 和 submitter Job；箭头不表示单次同步调用。</text></g></svg>