<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" style="max-width:960px" role="img" aria-labelledby="deployment-title"><title id="deployment-title">deployment</title><defs><marker id="deployment-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="15" width="440" height="180" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1.5"/><rect x="21" y="16" width="438" height="5" rx="3" fill="#8ba9d6" stroke="#8ba9d6" stroke-width="1"/><text x="40" y="47" text-anchor="start" font-size="18" font-weight="600" fill="#244f86">Operator Pod</text><text x="40" y="71" text-anchor="start" font-size="14" font-weight="400" fill="#244f86">一个 Go 主进程，共享一个 Manager</text><path d="M40 84 L440 84" stroke="#d9dde1" stroke-width="1"/><text x="40" y="111" text-anchor="start" font-size="16" font-weight="400" fill="#262a2e">RayCluster Controller</text><text x="40" y="139" text-anchor="start" font-size="16" font-weight="400" fill="#262a2e">RayJob Controller</text><text x="40" y="167" text-anchor="start" font-size="16" font-weight="400" fill="#262a2e">RayService Controller</text><rect x="500" y="15" width="440" height="180" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><rect x="501" y="16" width="438" height="5" rx="3" fill="#8dbdb0" stroke="#8dbdb0" stroke-width="1"/><text x="520" y="47" text-anchor="start" font-size="18" font-weight="600" fill="#256354">Ray head Pod</text><text x="520" y="71" text-anchor="start" font-size="14" font-weight="400" fill="#256354">Ray 容器中的主要进程</text><path d="M520 84 L920 84" stroke="#d9dde1" stroke-width="1"/><text x="520" y="116" text-anchor="start" font-size="16" font-weight="400" fill="#262a2e">GCS  ·  Dashboard  ·  raylet</text><text x="520" y="161" tex