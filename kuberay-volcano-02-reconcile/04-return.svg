<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370" style="max-width:960px" role="img" aria-labelledby="returns-title"><title id="returns-title">returns</title><defs><marker id="returns-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="143" width="190" height="64" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="115" y="168.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Reconcile 返回</text><text x="115" y="191.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Result + error</text><rect x="300" y="23" width="260" height="52" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="430" y="54" text-anchor="middle" font-size="15" font-weight="500" fill="#805929">普通 error</text><rect x="620" y="23" width="320" height="52" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="780" y="54" text-anchor="middle" font-size="14" font-weight="500" fill="#805929">限速重试；忽略 RequeueAfter</text><path d="M210 175 H253 V49 H300" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#returns-arrow)"/><path d="M560 49 H620" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#returns-arrow)"/><rect x="300" y="105" width="260" height="52" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="430" y="136" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">TerminalError</text><rect x="620" y="105" width="320" height="52" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="780" y="136" text-anchor="middle" font-size="14" font-weight="500" fill="#415670">本次不自动重试</text><path d="M210 175 H253 V131 H300" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#returns-arrow)"/><path d="M560 131 H620" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#returns-arrow)"/><rect x="300" y="187" width="260" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="430" y="218" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">无错误 + RequeueAfter</text><rect x="620" y="187" width="320" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="780" y="218" text-anchor="middle" font-size="14" font-weight="500" fill="#244f86">清除限速记录，安排延时</text><path d="M210 175 H253 V213 H300" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#returns-arrow)"/><path d="M560 213 H620" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#returns-arrow)"/><rect x="300" y="269" width="260" height="52" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="430" y="300" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">无错误 + 空 Result</text><rect x="620" y="269" width="320" height="52" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="780" y="300" text-anchor="middle" font-size="14" font-weight="500" fill="#256354">不主动重排，仍可接收新事件</text><path d="M210 175 H253 V295 H300" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#returns-arrow)"/><path d="M560 295 H620" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#returns-arrow)"/></g></svg>