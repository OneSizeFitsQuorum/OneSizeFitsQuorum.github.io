<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" style="max-width:960px" role="img" aria-labelledby="round-title"><title id="round-title">round</title><defs><marker id="round-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="45" width="200" height="56" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="120" y="78" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">取出对象标识</text><path d="M220 73 H260" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#round-arrow)"/><rect x="260" y="45" width="200" height="56" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="360" y="78" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">读取 RayCluster</text><path d="M460 73 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#round-arrow)"/><rect x="500" y="45" width="200" height="56" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="600" y="78" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">校验与分支判断</text><path d="M700 73 H740" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#round-arrow)"/><rect x="740" y="45" width="200" height="56" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="840" y="78" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">维护 Pod / Service</text><rect x="740" y="194" width="200" height="62" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="840" y="218.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">计算与写回 status</text><text x="840" y="241.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">返回 Result / error</text><path d="M840 101 V194" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#round-arrow)"/><rect x="260" y="194" width="300" height="62" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="410" y="218.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">Kubernetes 异步执行</text><text x="410" y="241.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">调度、启动与更新 Pod</text><path d="M560 224 H740" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#round-arrow)"/><text x="650" y="210" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">状态供后续观察</text><path d="M840 101 V151 H410 V194" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#round-arrow)"/><text x="606" y="141" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">资源请求交由 Kubernetes 执行</text><rect x="20" y="302" width="920" height="38" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="327" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">创建请求完成后可以结束本轮；后续事件或延时请求再触发检查。</text></g></svg>