<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" style="max-width:960px" role="img" aria-labelledby="events-title"><title id="events-title">events</title><defs><marker id="events-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="50" width="200" height="70" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="120" y="78.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">API Server</text><text x="120" y="101.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">接收 Pod 状态更新</text><path d="M220 85 H260" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#events-arrow)"/><rect x="260" y="50" width="200" height="70" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="360" y="78.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Informer / Cache</text><text x="360" y="101.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">同步对象，通知 handler</text><path d="M460 85 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#events-arrow)"/><rect x="500" y="50" width="200" height="70" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="600" y="78.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">事件处理器</text><text x="600" y="101.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">过滤并映射资源标识</text><path d="M700 85 H740" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#events-arrow)"/><rect x="740" y="50" width="200" height="70" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="840" y="78.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Controller 队列</text><text x="840" y="101.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">等待协调协程取出</text><rect x="500" y="219" width="200" height="62" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="600" y="243.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Reconcile</text><text x="600" y="266.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">重新读取资源</text><path d="M840 120 V250 H700" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#events-arrow)"/><text x="811" y="192" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">取出 namespace/name</text><path d="M600 219 V164 H360 V120" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#events-arrow)"/><text x="462" y="153" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">读取缓存</text><rect x="20" y="305" width="920" height="38" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="330" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">缓存保存资源对象；队列保存待协调对象的标识。</text></g></svg>