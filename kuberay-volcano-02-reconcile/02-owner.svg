<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="411" viewBox="0 0 1000 411" style="max-width:1000px" role="img" aria-labelledby="owner-title"><title id="owner-title">owner</title><defs><marker id="owner-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="17" y="16" width="176" height="52" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="105" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">Pod / API</text><path d="M105 68 V365" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="412" y="16" width="176" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="500" y="35.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">RayCluster</text><text x="500" y="58.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Controller</text><path d="M500 68 V365" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="807" y="16" width="176" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="895" y="35.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">RayJob</text><text x="895" y="58.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Controller</text><path d="M895 68 V365" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><path d="M105 111 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#owner-arrow)"/><text x="302.5" y="101" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Pod 事件：按 owner reference 找到 RayCluster</text><path d="M500 166 H105" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#owner-arrow)"/><text x="302.5" y="156" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">重新观察 Pod，写回 RayCluster status</text><path d="M105 221 H895" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#owner-arrow)"/><text x="500" y="211" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">RayCluster 事件：找到所属 RayJob</text><path d="M895 276 H105" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#owner-arrow)"/><text x="500" y="266" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">读取集群状态，满足条件后创建 submitter Job</text><rect x="24" y="309" width="952" height="33" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="500" y="331" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b">Owns 默认匹配 controller owner；每次只处理注册的这一层关系。</text><text x="500" y="398" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">中间的通知经各自 handler 和队列传递，图中省略。</text></g></svg>