<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">从 RayJob 到用户程序的完整路径</title>
  <desc id="desc">流程分为声明、集群准备、Pod 调度、程序提交和执行收尾五个阶段。Volcano 在 Pod 调度阶段可选接入。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs>
  <rect width="960" height="560" fill="#fbfcfe"/>
  <style>.t{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#243449}.h{font-size:22px;font-weight:700}.m{font-size:16px;font-weight:650}.s{font-size:14px;fill:#536579}.box{fill:#fff;stroke:#9fb7d2;stroke-width:1.5}.ray{fill:#eef4ff;stroke:#76a2e8}.vol{fill:#fff3e8;stroke:#df9b62}.ok{fill:#eaf7f3;stroke:#79baa8}.line{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}</style>
  <text x="36" y="42" class="t h">一次 RayJob 的完整执行链</text>
  <text x="36" y="70" class="t s">每个阶段写下结果，下一位观察者再从自己的状态入口继续推进。</text>
  <text x="36" y="118" class="t m">声明</text><text x="216" y="118" class="t m">集群准备</text><text x="418" y="118" class="t m">Pod 调度</text><text x="624" y="118" class="t m">程序提交</text><text x="810" y="118" class="t m">执行与收尾</text>
  <rect x="28" y="142" width="136" height="76" rx="10" class="ray"/><text x="96" y="174" text-anchor="middle" class="t m">RayJob</text><text x="96" y="198" text-anchor="middle" class="t s">期望与策略</text>
  <rect x="208" y="142" width="136" height="76" rx="10" class="ray"/><text x="276" y="174" text-anchor="middle" class="t m">RayCluster</text><text x="276" y="198" text-anchor="middle" class="t s">专用集群</text>
  <rect x="404" y="142" width="150" height="76" rx="10" class="box"/><text x="479" y="174" text-anchor="middle" class="t m">head + worker</text><text x="479" y="198" text-anchor="middle" class="t s">Pod 与 Service</text>
  <rect x="606" y="142" width="150" height="76" rx="10" class="ray"/><text x="681" y="174" text-anchor="middle" class="t m">submitter Job</text><text x="681" y="198" text-anchor="middle" class="t s">提交入口命令</text>
  <rect x="804" y="142" width="128" height="76" rx="10" class="ok"/><text x="868" y="174" text-anchor="middle" class="t m">Ray 作业</text><text x="868" y="198" text-anchor="middle" class="t s">task / Actor</text>
  <path d="M164 180H208M344 180H404M554 180H606M756 180H804" class="line"/>
  <rect x="334" y="276" width="290" height="112" rx="12" class="vol"/><text x="479" y="309" text-anchor="middle" class="t m">可选：Volcano</text><text x="479" y="335" text-anchor="middle" class="t s">先创建 PodGroup</text><text x="479" y="359" text-anchor="middle" class="t s">再按 Gang、Queue 和节点条件调度 Pod</text>
  <path d="M276 218V244H408V276" class="line"/><path d="M550 276V244H681V218" class="line"/>
  <rect x="28" y="438" width="904" height="82" rx="12" fill="#f2f6fa" stroke="#c9d5e2"/>
  <text x="50" y="470" class="t m">不变的主干</text><text x="50" y="498" class="t s">RayCluster Ready 之后才创建 submitter；Volcano 改变 Pod 获得节点的方式，不改变 RayJob 提交程序的阶段顺序。</text>
</svg>
