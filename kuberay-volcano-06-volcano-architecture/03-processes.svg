<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" style="max-width:960px" role="img" aria-labelledby="v06-processes-title"><title id="v06-processes-title">v06-processes</title><defs><marker id="v06-processes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="32" text-anchor="start" font-size="18" font-weight="600" fill="#18354b">基本服务角色与通信边界</text><rect x="340" y="68" width="280" height="65" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="480" y="94" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">Kubernetes API Server</text><text x="480" y="117" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">保存资源，提供 watch</text><rect x="30" y="227" width="250" height="79" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="155" y="260" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Controller Manager</text><text x="155" y="283" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Job / Queue / PodGroup 控制器</text><rect x="355" y="227" width="250" height="79" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="480" y="260" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Scheduler</text><text x="480" y="283" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Cache / Action / Plugin</text><rect x="680" y="227" width="250" height="79" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="805" y="260" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">Admission Webhook</text><text x="805" y="283" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">校验与补全匹配请求</text><path d="M155 227 V166 H380 V133" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v06-processes-arrow)"/><text x="211" y="156" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">观察、维护对象</text><path d="M480 227 V133" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v06-processes-arrow)"/><text x="480" y="181" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">观察、绑定、写回</text><path d="M620 100 H805 V227" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v06-processes-arrow)"/><text x="799" y="150" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">API Server 调用</text><rect x="355" y="377" width="250" height="63" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="480" y="402" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">节点 kubelet</text><text x="480" y="425" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">启动已绑定的 Pod</text><path d="M340 100 H313 V408 H355" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#v06-processes-arrow)"/><text x="202" y="360" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">从 API 观察节点上的 Pod</text><text x="800" y="356" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Webhook 返回允许 / 拒绝或补丁</text><text x="480" y="468" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">图中一个方框表示一种进程角色，未展开副本及扩展组件。</text></g></svg>