hor="middle" font-size="15" font-weight="500" fill="#256354">节点 kubelet</text><path d="M100 133 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v06-handoff-arrow)"/><text x="226.66666666666669" y="118" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">维护 PodGroup、RayCluster 与 Ray Pod</text><path d="M353.33333333333337 199 H606.6666666666667" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v06-handoff-arrow)"/><text x="480.00000000000006" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">观察 PodGroup、Queue、Pod 和 Node</text><path d="M606.6666666666667 265 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v06-handoff-arrow)"/><text x="480.00000000000006" y="250" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">资源满足约束后，提交 Pod 绑定</text><path d="M353.33333333333337 331 H860" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v06-handoff-arrow)"/><text x="606.6666666666667" y="316" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">节点观察到分配结果，启动 head / worker 容器</text><path d="M353.33333333333337 397 H100" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#v06-handoff-arrow)"/><text x="226.66666666666669" y="382" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">后续资源状态供 KubeRay 判断集群就绪</text><path d="M100 463 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v06-handoff-arrow)"/><text x="226.66666666666669" y="448" t