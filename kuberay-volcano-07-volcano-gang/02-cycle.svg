<svg xmlns="http://www.w3.org/2000/svg" width="960" height="454" viewBox="0 0 960 454" style="max-width:960px" role="img" aria-labelledby="v07-cycle-title"><title id="v07-cycle-title">v07-cycle</title><defs><marker id="v07-cycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="32" text-anchor="start" font-size="18" font-weight="600" fill="#18354b">同一组 Pod 经过不同层次的检查</text><rect x="28" y="71" width="158" height="62" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="107" y="107" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">enqueue</text><rect x="230" y="71" width="326" height="62" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="393" y="107" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">minResources + 资源策略</text><rect x="600" y="71" width="330" height="62" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="765" y="107" text-anchor="middle" font-size="15" font-weight="500" fill="#805929">PodGroup 在本轮进入 Inqueue</text><path d="M186 102 H230" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-cycle-arrow)"/><path d="M556 102 H600" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-cycle-arrow)"/><path d="M107 133 V176" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-cycle-arrow)"/><rect x="28" y="176" width="158" height="62" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="107" y="212" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">allocate</text><rect x="230" y="176" width="326" height="62" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="393" y="212" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">Queue → 作业 → Pod → 节点</text><rect x="600" y="176" width="330" height="62" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="765" y="212" text-anchor="middle" font-size="15" font-weight="500" fill="#805929">暂定放置，更新 Session 账目</text><path d="M186 207 H230" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-cycle-arrow)"/><path d="M556 207 H600" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-cycle-arrow)"/><path d="M107 238 V281" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-cycle-arrow)"/><rect x="28" y="281" width="158" height="62" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="107" y="317" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">JobReady</text><rect x="230" y="281" width="326" height="62" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="393" y="317" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">最低成员 + task / 子组要求</text><rect x="600" y="281" width="330" height="62" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="765" y="317" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">满足条件后提交 Statement</text><path d="M186 312 H230" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-cycle-arrow)"/><path d="M556 312 H600" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-cycle-arrow)"/><rect x="24" y="396" width="912" height="42" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="423" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">Inqueue 不是节点分配结果；JobReady 也不是容器健康或 RayCluster 就绪。</text></g></svg>