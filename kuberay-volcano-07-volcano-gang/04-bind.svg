<svg xmlns="http://www.w3.org/2000/svg" width="960" height="596" viewBox="0 0 960 596" style="max-width:960px" role="img" aria-labelledby="v07-bind-title"><title id="v07-bind-title">v07-bind</title><defs><marker id="v07-bind-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><path d="M100 79 V531" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="17" y="18" width="166" height="58" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="100" y="40.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Session</text><text x="100" y="63.5" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Statement</text><path d="M353.33333333333337 79 V531" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="270.33333333333337" y="18" width="166" height="58" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="353.33333333333337" y="52" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">SchedulerCache</text><path d="M606.6666666666667 79 V531" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="523.6666666666667" y="18" width="166" height="58" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="606.6666666666667" y="52" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">后台绑定流程</text><path d="M860 79 V531" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="777" y="18" width="166" height="58" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="860" y="52" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">Kubernetes API</text><path d="M100 133 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-bind-arrow)"/><text x="226.66666666666669" y="118" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Commit：AddBindTask，缓存记录 Binding 与资源占用</text><path d="M353.33333333333337 199 H606.6666666666667" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-bind-arrow)"/><text x="480.00000000000006" y="184" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">BindFlowChannel 交付待绑定成员</text><path d="M606.6666666666667 265 H860" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-bind-arrow)"/><text x="733.3333333333334" y="250" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">PreBind 后逐项绑定，结果可能部分成功</text><path d="M860 331 H606.6666666666667" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#v07-bind-arrow)"/><text x="733.3333333333334" y="316" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">返回各成员绑定结果</text><path d="M606.6666666666667 397 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#v07-bind-arrow)"/><text x="480.00000000000006" y="382" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">失败成员：记录错误、PreBind 回滚、resyncTask</text><path d="M860 463 H353.33333333333337" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#v07-bind-arrow)"/><text x="606.6666666666667" y="448" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">watch 与重新同步带来最新 Pod 状态</text><rect x="24" y="544" width="912" height="42" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="571" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">成功的 API 绑定不会被另一个成员的失败自动撤销。</text></g></svg>