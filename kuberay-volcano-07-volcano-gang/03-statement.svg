<svg xmlns="http://www.w3.org/2000/svg" width="960" height="444" viewBox="0 0 960 444" style="max-width:960px" role="img" aria-labelledby="v07-statement-title"><title id="v07-statement-title">v07-statement</title><defs><marker id="v07-statement-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="24" y="32" text-anchor="start" font-size="18" font-weight="600" fill="#18354b">minMember = 3：两次独立的试分配</text><rect x="24" y="65" width="442" height="300" rx="6" fill="#f8fafc" stroke="#bdc7d2" stroke-width="1"/><rect x="494" y="65" width="442" height="300" rx="6" fill="#f8fafc" stroke="#bdc7d2" stroke-width="1"/><text x="245" y="96" text-anchor="middle" font-size="17" font-weight="600" fill="#262a2e">三个 Pod 均能放置</text><text x="715" y="96" text-anchor="middle" font-size="17" font-weight="600" fill="#262a2e">第三个 Pod 放置失败</text><rect x="45" y="119" width="400" height="44" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="245" y="146" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">head → Allocated</text><rect x="45" y="177" width="400" height="44" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="245" y="204" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">worker 1 → Allocated</text><rect x="45" y="235" width="400" height="44" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="245" y="262" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">worker 2 → Allocated</text><rect x="515" y="119" width="400" height="44" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="715" y="146" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">head → Allocated</text><rect x="515" y="177" width="400" height="44" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="715" y="204" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">worker 1 → Allocated</text><rect x="515" y="235" width="400" height="44" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="715" y="262" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">worker 2 → 无合法节点</text><rect x="45" y="305" width="400" height="43" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="245" y="331.5" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">JobReady → Commit</text><rect x="515" y="305" width="400" height="43" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="715" y="331.5" text-anchor="middle" font-size="15" font-weight="500" fill="#805929">不满足 Ready / Pipelined → Discard</text><rect x="24" y="386" width="912" height="42" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="413" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">Discard 撤销这次暂定分配；本图假设无可供 Pipeline 使用的未来释放资源。</text></g></svg>