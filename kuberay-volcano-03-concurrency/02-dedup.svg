<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="466" viewBox="0 0 1000 466" style="max-width:1000px" role="img" aria-labelledby="dedup-title"><title id="dedup-title">dedup</title><defs><marker id="dedup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="17" y="16" width="176" height="52" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="105" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">事件来源</text><path d="M105 68 V420" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="412" y="16" width="176" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="500" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Controller 队列</text><path d="M500 68 V420" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="807" y="16" width="176" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="895" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">协调协程</text><path d="M895 68 V420" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><path d="M105 111 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#dedup-arrow)"/><text x="302.5" y="101" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">A 的事件入队</text><path d="M500 166 H895" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#dedup-arrow)"/><text x="697.5" y="156" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">取出 A，标记正在处理</text><path d="M105 221 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#dedup-arrow)"/><text x="302.5" y="211" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">处理期间 A 又发生变化</text><rect x="24" y="254" width="952" height="33" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="500" y="276" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b">新的请求被记录，A 不会同时交给另一个协调协程。</text><path d="M895 331 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#dedup-arrow)"/><text x="697.5" y="321" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">本轮处理结束，Done(A)</text><path d="M500 386 H895" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#dedup-arrow)"/><text x="697.5" y="376" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">若有待处理变化，再次交付 A</text><text x="500" y="453" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">仅说明同一个 Controller 的本地队列；不是跨进程锁。</text></g></svg>