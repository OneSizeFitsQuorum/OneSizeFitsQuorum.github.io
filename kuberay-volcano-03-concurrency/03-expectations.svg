<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="466" viewBox="0 0 1000 466" style="max-width:1000px" role="img" aria-labelledby="expectations-title"><title id="expectations-title">expectations</title><defs><marker id="expectations-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="17" y="16" width="176" height="52" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="105" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Controller</text><path d="M105 68 V420" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="412" y="16" width="176" height="52" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="500" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">API Server</text><path d="M500 68 V420" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><rect x="807" y="16" width="176" height="52" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="895" y="47" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">本地缓存</text><path d="M895 68 V420" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5"/><path d="M105 111 H500" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#expectations-arrow)"/><text x="302.5" y="101" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">创建一个缺少的 worker Pod</text><path d="M500 166 H105" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#expectations-arrow)"/><text x="302.5" y="156" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">创建成功，记录待观察的 Pod</text><path d="M105 221 H895" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#expectations-arrow)"/><text x="500" y="211" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">下一轮读取：新 Pod 可能尚不可见</text><rect x="24" y="254" width="952" height="33" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="500" y="276" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b">已有未满足的 expectation：先等待观察，不立即重复补建。</text><path d="M500 331 H895" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#expectations-arrow)"/><text x="697.5" y="321" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">后续 watch 更新带来新 Pod</text><path d="M105 386 H895" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#expectations-arrow)"/><text x="500" y="376" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">读取到目标 Pod，满足 expectation</text><text x="500" y="453" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">创建：Get 成功或超 30 秒；删除：NotFound，无同等超时；记录仅在进程内。</text></g></svg>