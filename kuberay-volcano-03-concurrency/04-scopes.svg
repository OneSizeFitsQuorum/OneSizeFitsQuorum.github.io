<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" style="max-width:960px" role="img" aria-labelledby="scopes-title"><title id="scopes-title">scopes</title><defs><marker id="scopes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="20" width="600" height="404" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="320" y="51" text-anchor="middle" font-size="18" font-weight="600" fill="#262a2e">Kubernetes 集群 A</text><rect x="40" y="91" width="170" height="65" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="125" y="117" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">API Server A</text><text x="125" y="140" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">资源读写入口</text><rect x="240" y="91" width="165" height="65" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="322.5" y="117" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">team-a</text><text x="322.5" y="140" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">demo-job-abcde</text><rect x="430" y="91" width="165" height="65" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="512.5" y="117" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">team-b</text><text x="512.5" y="140" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">demo-job-abcde</text><text x="410" y="181" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b">不同 namespace 的对象可以进入同一类队列</text><rect x="40" y="224" width="560" height="174" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="320" y="253" text-anchor="middle" font-size="16" font-weight="500" fill="#262a2e">一个 Operator / Manager</text><rect x="55" y="281" width="166" height="88" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="138" y="318.5" text-anchor="middle" font-size="13" font-weight="500" fill="#244f86">RayCluster Controller</text><text x="138" y="341.5" text-anchor="middle" font-size="13" font-weight="500" fill="#244f86">独立队列与协调协程</text><rect x="237" y="281" width="166" height="88" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="320" y="318.5" text-anchor="middle" font-size="13" font-weight="500" fill="#244f86">RayJob Controller</text><text x="320" y="341.5" text-anchor="middle" font-size="13" font-weight="500" fill="#244f86">独立队列与协调协程</text><rect x="419" y="281" width="166" height="88" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="502" y="318.5" text-anchor="middle" font-size="13" font-weight="500" fill="#244f86">RayService Controller</text><text x="502" y="341.5" text-anchor="middle" font-size="13" font-weight="500" fill="#244f86">独立队列与协调协程</text><path d="M125 224 V156" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#scopes-arrow)"/><text x="136" y="209" text-anchor="start" font-size="14" font-weight="400" fill="#56616b">共享 API 客户端</text><rect x="660" y="20" width="280" height="404" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="800" y="51" text-anchor="middle" font-size="18" font-weight="600" fill="#262a2e">Kubernetes 集群 B</text><rect x="680" y="91" width="240" height="65" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="800" y="128.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">API Server B</text><rect x="680" y="281" width="240" height="88" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="800" y="318.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">对应的 Operator</text><text x="800" y="341.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">独立配置与队列</text><path d="M800 281 V156" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#scopes-arrow)"/><text x="815" y="218" text-anchor="start" font-size="14" font-weight="400" fill="#56616b">连接 B</text><text x="480" y="452" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">namespace 不会自动分配专属协程；另一套 Kubernetes 集群需要对应管理实例。</text></g></svg>