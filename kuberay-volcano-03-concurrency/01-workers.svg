<svg xmlns="http://www.w3.org/2000/svg" width="960" height="485" viewBox="0 0 960 485" style="max-width:960px" role="img" aria-labelledby="workers-title"><title id="workers-title">workers</title><defs><marker id="workers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="25" y="33" text-anchor="start" font-size="18" font-weight="600" fill="#262a2e">示例：RayCluster Controller，协调并发数 = 2</text><rect x="25" y="62" width="910" height="54" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="480" y="94" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">队列中有 A、B、C、D 等集群的待处理标识</text><text x="25" y="181" text-anchor="start" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">协调协程 1</text><path d="M185 176 H930" fill="none" stroke="#68717a" stroke-width="1.35"/><rect x="185" y="148" width="175" height="56" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="272.5" y="181" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">检查集群 A</text><rect x="390" y="148" width="205" height="56" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="492.5" y="181" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">检查集群 C</text><text x="25" y="257" text-anchor="start" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">协调协程 2</text><path d="M185 252 H930" fill="none" stroke="#68717a" stroke-width="1.35"/><rect x="185" y="224" width="285" height="56" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="327.5" y="257" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">检查集群 B</text><rect x="500" y="224" width="220" height="56" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="610" y="257" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">检查集群 D</text><path d="M185 313 H935" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#workers-arrow)"/><text x="890" y="302" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">时间</text><text x="25" y="365" text-anchor="start" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ray 程序</text><rect x="185" y="339" width="745" height="44" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="557.5" y="366" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">A、B、C 等集群的计算可以跨越多轮协调持续运行</text><rect x="20" y="421" width="920" height="38" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="446" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">A 的检查返回后，其 Ray 程序仍可运行；协程立即处理其他集群。</text></g></svg>