="384" text-anchor="middle" font-size="14" font-weight="500" fill="#244f86">3  更新 Serve Service</text><text x="595" y="407" text-anchor="middle" font-size="14" font-weight="500" fill="#244f86">独立 API 写入</text><path d="M700 390 H725" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#service-arrow)"/><rect x="725" y="358" width="210" height="65" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="830" y="384" text-anchor="middle" font-size="14" font-weight="500" fill="#244f86">4  提升 active 状态</text><text x="830" y="407" text-anchor="middle" font-size="14" font-weight="500" fill="#244f86">延迟清理旧集群</text><rect x="20" y="465" width="920" height="38" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="490" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">两次 Service 更新可能部分成功；后续协调重试，不构成跨资源原子切换。</text></g></svg>