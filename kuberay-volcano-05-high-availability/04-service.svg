<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" style="max-width:960px" role="img" aria-labelledby="service-title"><title id="service-title">service</title><defs><marker id="service-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="140" width="200" height="70" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="120" y="168.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">RayService</text><text x="120" y="191.5" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Controller</text><rect x="365" y="30" width="225" height="75" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="477.5" y="61" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">active RayCluster</text><text x="477.5" y="84" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">继续承载现有服务</text><rect x="365" y="245" width="225" height="75" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="477.5" y="276" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">pending RayCluster</text><text x="477.5" y="299" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">准备集群与 Serve 应用</text><rect x="735" y="140" width="205" height="70" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="837.5" y="168.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">Service 访问入口</text><text x="837.5" y="191.5" text-anchor="middle" font-size="16" font-weight="500" fill="#415670">选择目标集群</text><path d="M220 175 H285 V68 H365" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#service-arrow)"/><text x="282" y="51" text-anchor="middle" font-size="14