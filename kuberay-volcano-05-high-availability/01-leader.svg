<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" style="max-width:960px" role="img" aria-labelledby="leader-title"><title id="leader-title">leader</title><defs><marker id="leader-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#68717a" stroke-width="1.3"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="20" y="45" width="230" height="108" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="135" y="81" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">Operator A</text><text x="135" y="104" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">当前主实例</text><text x="135" y="127" text-anchor="middle" font-size="15" font-weight="500" fill="#244f86">启动需要选主的 Controller</text><rect x="355" y="45" width="250" height="108" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="480" y="81" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">API Server 中的 Lease</text><text x="480" y="104" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">ray-operator-leader</text><text x="480" y="127" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">同一 namespace / name</text><rect x="710" y="45" width="230" height="108" rx="6" fill="#edf3ff" stroke="#8ba9d6" stroke-width="1"/><text x="825" y="81" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">Operator B</text><text x="825" y="104" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">候选实例</text><text x="825" y="127" text-anchor="middle" font-size="16" font-weight="500" fill="#244f86">等待获得领导权</text><path d="M250 99 H355" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#leader-arrow)"/><text x="302" y="84" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">续约</text><path d="M710 99 H605" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#leader-arrow)"/><text x="657" y="84" text-anchor="middle" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">尝试获取</text><rect x="20" y="250" width="230" height="68" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="135" y="277.5" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">业务资源</text><text x="135" y="300.5" text-anchor="middle" font-size="15" font-weight="500" fill="#256354">RayCluster / RayJob 等</text><path d="M135 153 V250" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#leader-arrow)"/><text x="150" y="207" text-anchor="start" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">执行协调</text><rect x="710" y="250" width="230" height="68" rx="6" fill="#f0f3f8" stroke="#acb9cc" stroke-width="1"/><text x="825" y="277.5" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">B 的本地缓存</text><text x="825" y="300.5" text-anchor="middle" font-size="15" font-weight="500" fill="#415670">启动时同步已有资源</text><path d="M825 250 V153" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#leader-arrow)"/><text x="839" y="209" text-anchor="start" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">本地读取</text><rect x="20" y="353" width="920" height="38" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="378" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">两个 Pod 都 Ready 不代表两个 leader；它们不互相复制业务状态。</text></g></svg>