nt-weight="500" fill="#415670">调度与容器管理</text><path d="M480 90 V177" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#faults-arrow)"/><text x="495" y="142" text-anchor="start" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">资源状态驱动</text><rect x="370" y="322" width="220" height="65" rx="6" fill="#eaf6f2" stroke="#8dbdb0" stroke-width="1"/><text x="480" y="348" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">Ray 运行时</text><text x="480" y="371" text-anchor="middle" font-size="16" font-weight="500" fill="#256354">GCS、task、actor</text><path d="M480 242 V322" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#faults-arrow)"/><text x="495" y="289" text-anchor="start" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">管理 Pod</text><rect x="715" y="322" width="220" height="65" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="825" y="348" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">外部 Redis</text><text x="825" y="371" text-anchor="middle" font-size="16" font-weight="500" fill="#805929">本文的持久化场景</text><path d="M590 354 H715" fill="none" stroke="#68717a" stroke-width="1.35" marker-end="url(#faults-arrow)"/><text x="652" y="341" text-anchor="middle" font-size="13" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">仅 GCS 元数据</text><path d="M130 90 V354 H370" fill="none" stroke="#68717a" stroke-width="1.35" stroke-dasharray="5 5" marker-end="url(#faults-arrow)"/><text x="145" y="241" text-anchor="start" font-size="14" font-weight="400" fill="#56616b" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Ray 管理 API</text><rect x="20" y="425" width="920" height="38" rx="6" fill="#fff4e5" stroke="#d5b181" stroke-width="1"/><text x="480" y="450" text-anchor="middle" font-size="14" font-weight="400" fill="#805929">Pod 重建不等于程序续跑；源码另有受特性开关约束的 RocksDB 后端。</text></g></svg>